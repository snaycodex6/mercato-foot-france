name: Mettre à jour les logos des topics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lancer les tests
        run: npm test
      - name: Générer topics.json
        run: npm run update-topics
      - name: Enregistrer une mise à jour
        run: |
          if git diff --quiet -- topics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.json
          git commit -m "Mettre à jour les logos des topics"
          git push
